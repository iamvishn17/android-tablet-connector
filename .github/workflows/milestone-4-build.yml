name: Build Milestone 4 Bundle

on:
  push:
    branches: [ "milestone-4" ]
    paths:
      - "app/**"
      - "windows-host/**"
      - ".github/workflows/milestone-4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: milestone4-android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-host:
    name: Build Windows Companion and bundle ADB
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-host/requirements.txt pyinstaller
      - name: Build Windows executable
        working-directory: windows-host
        run: pyinstaller --noconfirm --clean --onefile --windowed --name USBPenDisplayHost main.py
      - name: Bundle Android Platform Tools
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "platform-tools.zip"
          $extract = Join-Path $env:RUNNER_TEMP "platform-tools"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path "windows-host/dist/platform-tools" | Out-Null
          Copy-Item "$extract/platform-tools/*" "windows-host/dist/platform-tools/" -Recurse -Force
          if (-not (Test-Path "windows-host/dist/platform-tools/adb.exe")) { throw "ADB was not included in the Platform Tools archive." }
      - uses: actions/upload-artifact@v4
        with:
          name: milestone4-windows-host
          path: windows-host/dist/**
          if-no-files-found: error
          retention-days: 14

  package:
    name: Assemble Milestone 4 ZIP
    runs-on: ubuntu-latest
    needs: [android, windows-host]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: milestone4-android
          path: bundle/Android
      - uses: actions/download-artifact@v4
        with:
          name: milestone4-windows-host
          path: bundle/Windows
      - name: Add virtual display setup helper and create ZIP
        run: |
          mkdir -p bundle/Windows/Virtual-Display-Driver
          cp windows-host/driver/setup-virtual-display-driver.ps1 bundle/Windows/Virtual-Display-Driver/
          cp windows-host/driver/README.txt bundle/Windows/Virtual-Display-Driver/
          cat > bundle/README-MILESTONE-4.txt <<'EOF'
          USB PEN DISPLAY - MILESTONE 4 DEVELOPMENT BUILD

          CONTENTS
          - Android/app-debug.apk: Lenovo Tab P12 app (screen receiver + stylus telemetry sender)
          - Windows/USBPenDisplayHost.exe: PC companion (screen capture + pen pressure diagnostics)
          - Windows/platform-tools/: bundled ADB tools; no separate ADB download is needed
          - Windows/Virtual-Display-Driver/: setup helper and instructions for the existing signed Virtual Display Driver

          SET UP THE VIRTUAL SECOND MONITOR (ONE TIME)
          1. Open Windows/Virtual-Display-Driver/README.txt.
          2. Run PowerShell as Administrator.
          3. Run setup-virtual-display-driver.ps1. It uses the official VirtualDrivers WinGet package.
          4. Open Virtual Driver Control and click Install if it has not already installed the driver.
          5. Open Settings > System > Display. Choose Extend these displays and arrange the virtual display.
          6. Set the virtual display to a tablet-friendly resolution such as 1920x1200 or 1600x1000.

          CONNECT THE TABLET
          1. Connect the Lenovo tablet with a USB data cable.
          2. Enable Developer options > USB debugging on the tablet and accept the authorization prompt.
          3. Run USBPenDisplayHost.exe.
          4. Click Refresh tablet (manual refresh only).
          5. Click Start USB receiver.
          6. Install and open Android/app-debug.apk on the tablet.
          7. In the PC app click Refresh displays, select the Virtual Display Driver monitor, then click Start screen video.
          8. Drag a window onto the virtual monitor in Windows. It should appear on the tablet.

          IMPORTANT
          - The existing Virtual Display Driver is installed separately by the included helper from its official WinGet source. The third-party driver binaries are not repackaged in this ZIP.
          - Virtual display driver installation requires administrator approval.
          - Windows 10/11 compatibility is provided by the third-party driver's current release; check its release notes for system-specific requirements.
          - The PC app captures whichever display you select. It does not silently switch displays.
          - USB video uses TCP port 27184 through ADB reverse.
          - Stylus telemetry uses TCP port 27183 and retains pressure, tilt, orientation, hover and button data.
          - This milestone displays and diagnoses stylus telemetry on the PC; it does not yet inject the tablet stylus as a native Windows Ink pen.
          - This is a development build. The third-party virtual display driver is maintained by VirtualDrivers, not by this project.
          EOF
          cd bundle
          zip -r ../Milestone-4-Build.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Milestone-4-Build
          path: Milestone-4-Build.zip
          if-no-files-found: error
          retention-days: 14
