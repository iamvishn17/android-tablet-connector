name: Build USB Pen Display Final

on:
  push:
    branches: ["semi-final"]
    paths:
      - ".github/workflows/semi-final-build.yml"
      - "tools/patch_anydisplay.py"
      - "tools/disable_native_pen.py"
      - "windows-host/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANYDISPLAY_REPO: efekurucay/anydisplay
  ANYDISPLAY_REF: d090a9e20ac785fb34d1f53877e095c319e02569

jobs:
  android:
    name: Build integrated Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: efekurucay/anydisplay
          ref: d090a9e20ac785fb34d1f53877e095c319e02569
          path: vendor/anydisplay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add original pen telemetry compatibility channel
        run: python tools/patch_anydisplay.py vendor/anydisplay
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build AnyDisplay Android APK
        working-directory: vendor/anydisplay/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: final-android
          path: vendor/anydisplay/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build unified Windows receiver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: efekurucay/anydisplay
          ref: d090a9e20ac785fb34d1f53877e095c319e02569
          path: vendor/anydisplay
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Route Windows pen input through VMulti
        run: python tools/disable_native_pen.py vendor/anydisplay
      - name: Build AnyDisplay native Windows host
        working-directory: vendor/anydisplay/windows
        run: cargo build --release
      - name: Build the unified PC receiver interface
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all hid --name USBPenDisplayReceiver windows-host/receiver.py
      - name: Bundle Android Platform Tools and receiver
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "platform-tools.zip"
          $extract = Join-Path $env:RUNNER_TEMP "platform-tools"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path "dist-final/Windows/platform-tools" | Out-Null
          Copy-Item "$extract/platform-tools/*" "dist-final/Windows/platform-tools/" -Recurse -Force
          Copy-Item "vendor/anydisplay/windows/target/release/anydisplay-win.exe" "dist-final/Windows/anydisplay-win.exe"
          Copy-Item "dist/USBPenDisplayReceiver.exe" "dist-final/Windows/USBPenDisplayReceiver.exe"
          if (-not (Test-Path "dist-final/Windows/platform-tools/adb.exe")) { throw "ADB missing from Platform Tools." }
      - uses: actions/upload-artifact@v4
        with:
          name: final-windows
          path: dist-final/Windows/**
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package final USB Pen Display ZIP
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-android
          path: bundle/Android
      - uses: actions/download-artifact@v4
        with:
          name: final-windows
          path: bundle/Windows
      - name: Prepare launcher and setup guide
        run: |
          mv bundle/Android/app-debug.apk bundle/Android/AnyDisplay-Final.apk
          cat > bundle/Start-USB-Pen-Display.bat <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0Windows"
          if not exist "USBPenDisplayReceiver.exe" (
            echo Windows receiver is missing. Extract the complete ZIP again.
            pause
            exit /b 1
          )
          start "" "USBPenDisplayReceiver.exe"
          EOF
          cat > bundle/README-FIRST.txt <<'EOF'
          USB PEN DISPLAY — FINAL RECEIVER BUILD
          
          WHAT THIS BUILD DOES
          - Detects an authorized Android tablet over USB automatically.
          - Installs/updates and launches the AnyDisplay Android client.
          - Starts the AnyDisplay Windows host over ADB USB forwarding.
          - Streams the selected Windows display to the tablet using hardware H.264 encoding/decoding where available.
          - Sends stylus pressure, coordinates, tilt, eraser and pen contact through AnyDisplay's native Windows synthetic-pen input path.
          - Provides one Windows interface for connection state, stream state, logs, retry and stop.
          
          INSTALL AND USE
          1. Extract the entire ZIP to a normal folder. Do not move files out of their folders.
          2. On the tablet, enable Developer options and USB debugging.
          3. Connect the tablet to the PC with a USB data cable, unlock it and accept the USB debugging authorization prompt.
          4. Double-click Start-USB-Pen-Display.bat.
          5. The receiver detects the tablet and starts the display session automatically.
          6. Keep the receiver open while using the tablet as your display/pen tablet.
          
          PEN PRESSURE — IMPORTANT
          Pressure is not a separate test or preview feature. The Android client sends stylus MotionEvents through AnyDisplay's PEN protocol. The Windows host converts those samples into synthetic Windows pen pointer events with pressure/tilt masks. Compatible drawing applications can consume that as pen input while the stream is active.
          This is the native input path; the old separate pressure diagnostic window is not part of this build.
          
          EXTENDED DISPLAY
          AnyDisplay uses the Virtual Display Driver (VDD) to create a real extra Windows monitor. Without VDD, the session mirrors a selected existing monitor.
          1. Install VDD separately from https://github.com/VirtualDrivers/Virtual-Display-Driver/releases
          2. In Windows Settings > System > Display, choose Extend these displays and arrange the virtual monitor.
          3. The AnyDisplay host selects the VDD monitor by default when available.
          
          TROUBLESHOOTING
          - If Windows asks about USB debugging, unlock the tablet and accept the authorization prompt.
          - If the receiver cannot find ADB, re-extract the complete ZIP; platform-tools/adb.exe must remain inside the Windows folder.
          - If the tablet is connected but sharing fails, press Reconnect / Retry in the receiver.
          - Close and reopen the receiver after changing USB ports or reinstalling the Android client.
          - Input into elevated/admin applications may require running the receiver as administrator because Windows blocks lower-integrity input injection.
          
          VALIDATION NOTE
          CI verifies that the Android APK, Windows host and receiver package compile successfully. Actual USB stability, Lenovo Tab P12 stylus behavior, Windows Ink compatibility and application-specific pressure response must still be tested on the physical Windows 10 PC and tablet. A successful build is not a substitute for that hardware test.
          
          THIRD-PARTY SOFTWARE
          AnyDisplay is pinned to commit d090a9e20ac785fb34d1f53877e095c319e02569 and is MIT licensed. See https://github.com/efekurucay/anydisplay
          Virtual Display Driver is a separate third-party MIT-licensed project and is not bundled.
          EOF
          cat > bundle/THIRD-PARTY-NOTICES.txt <<'EOF'
          AnyDisplay
          Copyright (c) 2026 Yahya Efe Kuruçay
          Licensed under the MIT License.
          https://github.com/efekurucay/anydisplay
          
          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:
          
          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.
          
          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.
          EOF
          cd bundle
          zip -r ../USB-Pen-Display-Final.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Pen-Display-Final
          path: USB-Pen-Display-Final.zip
          if-no-files-found: error
          retention-days: 30
